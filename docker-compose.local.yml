services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexora:local
    container_name: nexora-local
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      CHATGPT2API_UPSTREAM_TRANSPORT: tls-client
      # 默认使用 /app/data/chatgpt2api.db；PostgreSQL 可设置 DATABASE_URL。
      # DATABASE_URL: postgresql://user:password@host:5432/dbname
      # CHATGPT2API_AUTH_KEY: your_secret_key  # 覆盖 config.json 中的 auth-key
