name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  web:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build -- --webpack

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          if-no-files-found: error

  package:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs:
      - web

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            binary_ext: ""
            archive_ext: tar.gz
            curl_asset: curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          - target: windows-amd64
            goos: windows
            goarch: amd64
            binary_ext: ".exe"
            archive_ext: zip
            curl_asset: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web_dist

      - name: Build binary and package release asset
        env:
          TARGET: ${{ matrix.target }}
          GOOS_VALUE: ${{ matrix.goos }}
          GOARCH_VALUE: ${{ matrix.goarch }}
          BINARY_EXT: ${{ matrix.binary_ext }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          CURL_ASSET: ${{ matrix.curl_asset }}
        run: |
          set -euo pipefail

          app_name="nexora"
          package_name="${app_name}-${TARGET}"
          package_dir="dist/${package_name}"
          binary_name="${app_name}${BINARY_EXT}"

          rm -rf dist
          mkdir -p "${package_dir}/bin"

          CGO_ENABLED=0 GOOS="${GOOS_VALUE}" GOARCH="${GOARCH_VALUE}" \
            go build -trimpath -ldflags="-s -w" -o "${package_dir}/bin/${binary_name}" ./cmd/server

          cp "${package_dir}/bin/${binary_name}" "${package_dir}/${binary_name}"
          cp -R web_dist "${package_dir}/web_dist"

          if [ -n "${CURL_ASSET}" ]; then
            mkdir -p "${package_dir}/data/bin/curl-impersonate"
            curl_url="https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/${CURL_ASSET}"
            curl -fsSL --retry 3 "${curl_url}" | tar -xz -C "${package_dir}/data/bin/curl-impersonate" || true
            find "${package_dir}/data/bin/curl-impersonate" -type f -exec chmod +x {} + 2>/dev/null || true
          fi

          for file in README.md LICENSE VERSION GO_MIGRATION.md; do
            if [ -f "${file}" ]; then
              cp "${file}" "${package_dir}/"
            fi
          done

          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            (
              cd dist
              zip -qr "${package_name}.zip" "${package_name}"
            )
          else
            (
              cd dist
              tar -czf "${package_name}.tar.gz" "${package_name}"
            )
          fi

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Determine Tag Name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "val=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "val=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.tag.outputs.val }}
        run: |
          set -euo pipefail

          if ! gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --repo "${GH_REPO}" --title "${TAG_NAME}" --generate-notes
          fi

          while IFS= read -r -d '' asset; do
            gh release upload "${TAG_NAME}" "${asset}" --repo "${GH_REPO}" --clobber
          done < <(find release-assets -type f -print0)
